<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d1b2e"><title>WANTOK PNG — Administration</title>
<style>
:root{--navy:#0d1b2e;--green:#16834a;--gold:#f5b800;--paper:#f4f7fa;--ink:#172235}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:var(--paper);color:var(--ink)}header{background:var(--navy);color:#fff;padding:17px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.brand{font-weight:900;letter-spacing:.5px}.brand span{color:var(--gold)}header small{display:block;color:#cbd5e1;font-weight:500}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:10px 14px;font-weight:700;background:var(--green);color:#fff}button:disabled{opacity:.55;cursor:wait}.secondary{background:#e8edf3;color:var(--navy)}.danger{background:#ffe9e9;color:#a11}main{max-width:1500px;margin:auto;padding:20px}.login{max-width:430px;margin:8vh auto;background:#fff;padding:25px;border-radius:16px;box-shadow:0 10px 35px #0d1b2e14}h1{margin:0 0 8px;font-size:25px}h2{font-size:19px}.hint{color:#617085;line-height:1.5}label{display:block;font-size:13px;font-weight:750;margin:14px 0 6px}input{width:100%;padding:13px;border:1px solid #ccd5df;border-radius:9px}.message,.error{margin-top:12px;font-size:13px;color:#17643a}.error{color:#b42318}.layout{display:grid;grid-template-columns:235px minmax(0,1fr);gap:18px;margin-top:18px}aside,.workspace,.panel{background:#fff;border-radius:14px;padding:15px;box-shadow:0 4px 18px #0d1b2e0a}.nav-item{display:block;width:100%;text-align:left;background:transparent;color:#334155;margin:3px 0}.nav-item.active{background:#e7f4ec;color:#126b3b}.workspace{min-width:0}.workspace h1{font-size:22px}.toolbar{display:flex;justify-content:space-between;align-items:center;margin:14px 0;color:#64748b;font-size:13px;gap:8px;flex-wrap:wrap}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:15px 0}.metric{background:#fff;color:var(--ink);border:1px solid #e1e7ee;text-align:left;padding:17px;box-shadow:0 4px 16px #0d1b2e08}.metric span{display:block;color:#64748b;font-size:13px}.metric strong{display:block;font-size:29px;margin-top:8px;color:var(--green)}.table-wrap{overflow:auto;border:1px solid #e3e8ef;border-radius:10px}table{border-collapse:collapse;width:100%;min-width:780px;font-size:13px}th,td{text-align:left;padding:11px;border-bottom:1px solid #edf0f4;vertical-align:top;max-width:320px;overflow-wrap:anywhere}th{background:#f5f7fa;position:sticky;top:0;text-transform:capitalize}td select{padding:7px;border:1px solid #d5dde6;border-radius:7px;max-width:150px}.actions{display:flex;gap:6px;align-items:flex-start}.small{padding:7px 9px;font-size:12px;background:#e8edf3;color:#1d2939}.empty,.loading,.error-box{padding:22px;background:#f8fafc;border-radius:10px;color:#526174}.error-box{color:#a11;background:#fff0f0}[hidden]{display:none!important}#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#102238;color:white;padding:12px 18px;border-radius:10px;opacity:0;pointer-events:none;transition:.2s}#toast.show{opacity:1}@media(max-width:760px){main{padding:12px}.layout{grid-template-columns:1fr}aside{display:flex;overflow:auto;gap:5px}.nav-item{white-space:nowrap;width:auto}.login{margin:5vh 12px}}
</style></head><body>
<header><div class="brand">WANTOK <span>PNG</span><small>National Digital Hub · Administration</small></div><div id="admin-area" hidden><span id="admin-email"></span> <button id="logout" class="secondary">Sign out</button></div></header>
<main><section id="login-panel" class="login"><h1>Administrator sign in</h1><p class="hint">Sign in with your existing WANTOK PNG administrator account. Access is checked against the Supabase administrator role.</p><form id="login-form"><label for="email">Email address</label><input id="email" type="email" autocomplete="username" required><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required><button id="login-button" type="submit" style="width:100%;margin-top:18px">Sign in securely</button></form><div id="login-status" class="message" role="status"></div></section>
<section id="app-panel" hidden><div class="layout"><aside id="nav" aria-label="Administration sections"></aside><section class="workspace"><h1 id="content-title">Overview</h1><div id="content"><div class="loading">Loading…</div></div></section></div></section></main><div id="toast" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script><script src="wantok-dashboard.js"></script></body></html>
