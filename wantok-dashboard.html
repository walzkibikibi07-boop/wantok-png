<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WANTOK PNG | National Admin Dashboard</title>
<meta name="theme-color" content="#0d1b2e">
<meta name="description" content="Secure WANTOK PNG administration dashboard">
<style>
:root{--navy:#0d1b2e;--red:#d62828;--gold:#f5b800;--green:#1f9d4a;--blue:#1565c0;--bg:#f2f5f9;--card:#fff;--line:#e5eaf0;--mut:#6b7686}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:#111;display:flex;min-height:100vh}
button{font-family:inherit;border:0;background:none;cursor:pointer;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px}
aside{width:220px;background:var(--navy);color:#fff;padding:18px 12px;position:sticky;top:0;height:100vh;flex:none;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px;font-weight:900;font-size:17px;line-height:1.1}
.brand i{width:34px;height:34px;border-radius:50%;background:conic-gradient(var(--red),var(--gold),var(--green),var(--red));display:block;flex:none}
.brand span{color:var(--gold)}
.brand small{display:block;font-weight:500;font-size:11px;opacity:.7;margin-top:2px}
aside button.nav{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;font-size:14px;font-weight:600;text-align:left;color:#cdd6e3}
aside button.nav:hover{background:rgba(255,255,255,.07)}
aside button.nav.on{background:var(--gold);color:#111}
aside .cnt{margin-left:auto;background:var(--red);color:#fff;font-size:11px;border-radius:9px;padding:1px 7px}
.conn{margin-top:auto;font-size:12px;padding:10px;border-radius:10px;background:rgba(255,255,255,.07);line-height:1.4}
main{flex:1;min-width:0;padding:22px 26px 60px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.top h1{font-size:24px;font-weight:800;flex:1;min-width:160px}
.sbox{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-width:200px;outline:none}
.btn{background:var(--navy);color:#fff;font-weight:700;font-size:13px;padding:9px 14px;border-radius:10px}
.btn.alt{background:var(--card);color:#222;border:1px solid var(--line)}
.btn.red{background:var(--red)}.btn.gold{background:var(--gold);color:#111}
.btn.sm{padding:6px 10px;font-size:12px;border-radius:8px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border-radius:14px;padding:14px 16px;border:1px solid var(--line);border-left:5px solid var(--c,var(--blue))}
.kpi small{color:var(--mut);font-size:12px;font-weight:600}
.kpi b{display:block;font-size:28px;font-weight:800;margin-top:2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;overflow:hidden}
.card h3{font-size:15px;font-weight:800;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.tag{font-size:11px;font-weight:700;padding:2px 9px;border-radius:9px;background:#eef1f6;color:#444;white-space:nowrap}
.tag.g{background:#d9f2e1;color:#14753a}.tag.r{background:#fde0e0;color:#b32020}.tag.y{background:#fff0c2;color:#8a6200}.tag.b{background:#d9ecff;color:#0f5aa8}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:12px;color:var(--mut);font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.t{max-width:300px}
td.wrap{white-space:normal}
td .act{display:flex;gap:6px;flex-wrap:nowrap}
select.st{border:1px solid var(--line);border-radius:8px;padding:5px 8px;background:#fff}
.empty{text-align:center;color:var(--mut);padding:26px;font-size:14px}
.form{display:grid;gap:10px;max-width:520px}
.form input,.form textarea,.form select{border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;background:#fff;outline:none}
.form input:focus,.form textarea:focus{border-color:var(--blue)}
.bars .r{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:13px}
.bars .r span:first-child{width:90px;flex:none}
.bars .bar{height:14px;border-radius:7px;background:var(--c,var(--blue));min-width:3px}
.bars .r b{font-size:12px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.toast{position:fixed;right:20px;bottom:20px;background:#111;color:#fff;padding:11px 18px;border-radius:12px;font-size:14px;opacity:0;transform:translateY(12px);transition:.25s;pointer-events:none;z-index:50}
.toast.show{opacity:1;transform:none}
.note{font-size:12px;color:var(--mut);margin-top:8px}
@media(max-width:820px){
  body{flex-direction:column}
  aside{width:100%;height:auto;position:static;flex-direction:row;overflow-x:auto;padding:10px;gap:6px}
  .brand,.conn{display:none}
  aside button.nav{white-space:nowrap;flex:none}
  main{padding:16px 14px 60px}
  .grid2{grid-template-columns:1fr}
}

#login{position:fixed;inset:0;z-index:100;background:linear-gradient(135deg,#0d1b2e,#183b52);display:grid;place-items:center;padding:20px}
#login[hidden],#app[hidden]{display:none!important}
.loginbox{background:#fff;border-radius:20px;padding:28px;width:min(100%,420px);box-shadow:0 20px 60px #0005}
.loginbox h1{font-size:24px;margin-bottom:8px}.loginbox p{color:var(--mut);font-size:14px;line-height:1.5;margin-bottom:18px}
.loginbox input{width:100%;padding:13px;border:1px solid var(--line);border-radius:10px;margin:6px 0 12px}
.loginbox button{width:100%;padding:13px}.loginbox .crest{font-size:32px}.brand b{color:var(--gold)}
.brand small{display:block;font-size:11px;font-weight:500;opacity:.7}.signout{margin-top:8px}
.conn{white-space:normal;overflow-wrap:anywhere}.kpis{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.kpi{border-left-color:var(--gold)}.kpi b{font-size:26px}.card p{font-size:14px;line-height:1.6;margin:8px 0 14px;color:#465263}
.card .note{font-size:12px;color:var(--mut)}.green{background:#d9f2e1;color:#14753a}
small{display:block;color:var(--mut);font-size:11px;margin-top:3px}.wide{min-width:220px;max-width:480px;white-space:normal}
.status{border:1px solid var(--line);padding:7px;border-radius:8px;background:white;max-width:140px}
.danger{background:#c62828;color:white}.small{padding:6px 9px;font-size:12px}.form textarea{resize:vertical}.check{font-size:13px;display:flex;align-items:center;gap:8px}.check input{width:auto}
button:disabled{opacity:.55;cursor:wait}
@media(max-width:820px){.brand{display:flex;flex:none;padding:0 8px;align-self:center}.brand small{display:none}.conn{display:none}aside{align-items:center}.signout{margin-top:0}main{padding:14px 10px 50px}.top h1{font-size:20px}.sbox{min-width:130px;flex:1}.loginbox{padding:22px}}
</style>
</head>
<body>
<section id="login"><div class="loginbox"><div class="crest">🇵🇬</div><h1>WANTOK PNG Admin</h1><p>Secure administrator sign-in. Use your existing WANTOK PNG account.</p><form id="loginForm"><label>Email address</label><input id="email" type="email" autocomplete="username" value="walzkibikibi07@gmail.com" required><label>Password</label><input id="password" type="password" autocomplete="current-password" placeholder="Your Supabase account password" required><button class="btn gold">Sign in securely</button></form><p class="note">Administrator access is verified against your database role. Never share your password.</p></div></section>
<div id="app" hidden>
<aside id="side"></aside>
<main><div class="top"><h1 id="pageTitle">Overview</h1><input class="sbox" id="search" placeholder="Search loaded records"><span id="who" class="tag"></span></div><div id="content"></div></main>
</div>
<div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="wantok-admin.js"></script>
</body>
</html>
